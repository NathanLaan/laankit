[workspace]
resolver = "2"
members = ["crates/*", "apps/pageliner/src-tauri", "apps/threadliner/src-tauri", "apps/noteliner/src-tauri", "apps/spikes/*", "apps/threadliner/native", "apps/pageliner/native"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
marina-core = { path = "crates/marina-core" }
marina-tauri = { path = "crates/marina-tauri" }
marina-egui = { path = "crates/marina-egui" }
marina-richtext = { path = "crates/marina-richtext" }
pageliner-epub = { path = "crates/pageliner-epub" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "time", "fs", "sync", "macros", "rt-multi-thread", "io-util", "io-std", "net"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
semver = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# Option C (pure Rust, egui) spikes. See docs/plans/plan-native-rust-egui.md.
spike-common = { path = "apps/spikes/common" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
egui_kittest = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release speed without the full LTO build, for measuring the spikes:
# `cargo run --profile spike -p spike-editor`.
[profile.spike]
inherits = "release"
lto = false
codegen-units = 16
strip = false
