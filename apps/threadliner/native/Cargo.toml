[package]
name = "threadliner-native"
version = "2.0.1"
description = "ThreadLiner in pure Rust: an egui UI over threadliner-core (plan Option C, docs/plans/plan-native-rust-egui.md)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "threadliner-native"
path = "src/main.rs"

[dependencies]
marina-core.workspace = true
marina-egui.workspace = true
marina-richtext.workspace = true
threadliner-core = { path = "../../../crates/threadliner-core" }
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
image.workspace = true
# 0.15, not 0.16: the Tauri dialog plugin enables 0.16's `gtk3` feature, which can't be
# combined with `xdg-portal`. 0.15 stays a separate crate, on the pure-Rust portal backend.
rfd = "0.15"
notify-rust = "4"

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "3"
