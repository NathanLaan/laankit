[package]
name = "threadliner-native"
version = "2.2.5"
description = "ThreadLiner in pure Rust: an egui UI over threadliner-core (plan Option C, docs/plans/plan-native-rust-egui.md)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The shipped `threadliner` binary since the cutover (docs/packaging.md).
[[bin]]
name = "threadliner"
path = "src/main.rs"

[dependencies]
marina-core.workspace = true
marina-egui.workspace = true
marina-richtext.workspace = true
threadliner-core = { path = "../../../crates/threadliner-core" }
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
image.workspace = true
# 0.15, not 0.16: the Tauri dialog plugin enables 0.16's `gtk3` feature, which can't be
# combined with `xdg-portal`. 0.15 stays a separate crate, on the pure-Rust portal backend.
rfd = "0.15"
notify-rust = "4"

# build.rs embeds the icon in the .exe (Windows hosts only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "3"

# --- Packaging (docs/packaging.md) --------------------------------------------
# Run `cargo run -p xtask -- icons` first: the icons come from packaging/generated.
# Since the cutover this is *the* ThreadLiner package: it installs /usr/bin/threadliner
# and replaces the Tauri build's `thread-liner` package. The Electron .deb/.rpm is
# also named `threadliner`, so this one upgrades it in place.

[package.metadata.deb]
name = "threadliner"
maintainer = "Nathan Laan <NathanLaan@users.noreply.github.com>"
copyright = "2026, Nathan Laan"
license-file = ["../../../LICENSE", "0"]
extended-description = """\
A feed reader for RSS 2.0, Atom and JSON Feed. Feeds, tags and read state \
are stored as JSON in a git repository and synced across machines."""
section = "net"
priority = "optional"
# $auto adds libc/libgcc. The rest are dlopened by winit/glutin/fontconfig, so
# dpkg-shlibdeps can't see them; git is run for sync.
depends = "$auto, git, libegl1, libgl1, libfontconfig1, libxkbcommon0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1, libxkbcommon-x11-0"
conflicts = "thread-liner"
replaces = "thread-liner"
provides = "thread-liner"
assets = [
    ["target/release/threadliner", "usr/bin/", "755"],
    ["../../../packaging/linux/com.threadline.app.desktop", "usr/share/applications/", "644"],
    ["../../../packaging/linux/com.threadline.app.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../../packaging/generated/threadliner/icons/16x16/com.threadline.app.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/24x24/com.threadline.app.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/32x32/com.threadline.app.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/48x48/com.threadline.app.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/64x64/com.threadline.app.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/128x128/com.threadline.app.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/256x256/com.threadline.app.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../../packaging/generated/threadliner/icons/512x512/com.threadline.app.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "threadliner"
license = "MIT"
summary = "Feed reader (RSS, Atom, JSON Feed) with git sync"
url = "https://github.com/NathanLaan/marina"
assets = [
    { source = "target/release/threadliner", dest = "/usr/bin/threadliner", mode = "755" },
    { source = "../../../packaging/linux/com.threadline.app.desktop", dest = "/usr/share/applications/com.threadline.app.desktop", mode = "644" },
    { source = "../../../packaging/linux/com.threadline.app.metainfo.xml", dest = "/usr/share/metainfo/com.threadline.app.metainfo.xml", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/16x16/com.threadline.app.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/24x24/com.threadline.app.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/32x32/com.threadline.app.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/48x48/com.threadline.app.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/64x64/com.threadline.app.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/128x128/com.threadline.app.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/256x256/com.threadline.app.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.threadline.app.png", mode = "644" },
    { source = "../../../packaging/generated/threadliner/icons/512x512/com.threadline.app.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.threadline.app.png", mode = "644" },
]
# Sonames, not package names, so the requirements hold across RPM distros.
[package.metadata.generate-rpm.requires]
git = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"
[package.metadata.generate-rpm.conflicts]
thread-liner = "*"
[package.metadata.generate-rpm.obsoletes]
thread-liner = "*"
[package.metadata.generate-rpm.provides]
thread-liner = "*"

# AppImage, the Windows NSIS installer and the macOS .app/.dmg (cargo-packager).
[package.metadata.packager]
product-name = "ThreadLiner"
identifier = "com.threadline.app"
description = "Feed reader (RSS, Atom, JSON Feed) with git sync"
homepage = "https://github.com/NathanLaan/marina"
authors = ["Nathan Laan"]
publisher = "Nathan Laan"
copyright = "Copyright (c) 2026 Nathan Laan"
license-file = "../../../LICENSE"
category = "News"
out-dir = "../../../target/packages/threadliner"
binaries-dir = "../../../target/release"
binaries = [{ path = "threadliner", main = true }]
icons = ["../../../packaging/generated/threadliner/icons/*/com.threadline.app.png"]

# The AppImage's desktop entry (cargo-packager builds it from its deb config).
[package.metadata.packager.deb]
desktop-template = "../../../packaging/linux/com.threadline.app.appimage.desktop.hbs"

[package.metadata.packager.nsis]
installer-icon = "../../../packaging/generated/threadliner/com.threadline.app.ico"
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
