[package]
name = "threadliner"
version = "2.2.5"
description = "ThreadLiner — RSS reader (Tauri build)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `threadliner-tauri`: plain `threadliner` is the native (egui) build since
# the cutover (docs/packaging.md).
[[bin]]
name = "threadliner-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
marina-core.workspace = true
marina-tauri.workspace = true
threadliner-core = { path = "../../../crates/threadliner-core" }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-notification.workspace = true

