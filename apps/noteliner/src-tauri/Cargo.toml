[package]
name = "noteliner"
version = "2.2.5"
description = "NoteLiner — outliner-style Markdown notes with git sync (Tauri build)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `noteliner-tauri`: plain `noteliner` is the native (egui) build since
# the cutover (docs/packaging.md).
[[bin]]
name = "noteliner-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
marina-core.workspace = true
marina-tauri.workspace = true
noteliner-core = { path = "../../../crates/noteliner-core" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"
