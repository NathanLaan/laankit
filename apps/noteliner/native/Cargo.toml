[package]
name = "noteliner-native"
version = "2.2.5"
description = "NoteLiner in pure Rust: an egui UI over noteliner-core (plan Option C, docs/plans/plan-native-rust-egui.md)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The shipped `noteliner` binary since the cutover (docs/packaging.md).
[[bin]]
name = "noteliner"
path = "src/main.rs"

[dependencies]
marina-core.workspace = true
marina-egui.workspace = true
marina-richtext.workspace = true
noteliner-core = { path = "../../../crates/noteliner-core" }
noteliner-export.workspace = true
noteliner-slides.workspace = true
marina-editor = { workspace = true, features = ["spellcheck"] }
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# 0.15, not 0.16: the Tauri dialog plugin enables 0.16's `gtk3` feature, which can't be
# combined with `xdg-portal`. 0.15 stays a separate crate, on the pure-Rust portal backend.
rfd = "0.15"
open = "5"

# build.rs embeds the icon in the .exe (Windows hosts only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
egui_kittest.workspace = true
hayro = "0.8"
tempfile = "3"

# --- Packaging (docs/packaging.md) --------------------------------------------
# Run `cargo run -p xtask -- icons` first: the icons come from packaging/generated.
# Since the cutover this is *the* NoteLiner package: it installs /usr/bin/noteliner
# and replaces the Tauri build's `note-liner` package. The Electron .deb/.rpm is
# also named `noteliner`, so this one upgrades it in place.

[package.metadata.deb]
name = "noteliner"
maintainer = "Nathan Laan <NathanLaan@users.noreply.github.com>"
copyright = "2026, Nathan Laan"
license-file = ["../../../LICENSE", "0"]
extended-description = """\
Outliner-style Markdown notes with git sync: a tree of notes, an editor with \
highlighting and spell check, wikilinks, backlinks, tags, history, slides, \
PDF/HTML export and an MCP server for AI clients."""
section = "editors"
priority = "optional"
# $auto adds libc/libgcc. The rest are dlopened by winit/glutin/fontconfig, so
# dpkg-shlibdeps can't see them; git is run for sync and history.
depends = "$auto, git, libegl1, libgl1, libfontconfig1, libxkbcommon0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1, libxkbcommon-x11-0"
conflicts = "note-liner"
replaces = "note-liner"
provides = "note-liner"
assets = [
    ["target/release/noteliner", "usr/bin/", "755"],
    ["../../../packaging/linux/com.nathanlaan.noteliner.desktop", "usr/share/applications/", "644"],
    ["../../../packaging/linux/com.nathanlaan.noteliner.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../../packaging/generated/noteliner/icons/16x16/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/24x24/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/32x32/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/48x48/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/64x64/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/128x128/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/256x256/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../../packaging/generated/noteliner/icons/512x512/com.nathanlaan.noteliner.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "noteliner"
license = "MIT"
summary = "Outliner-style Markdown notes with git sync"
url = "https://github.com/NathanLaan/marina"
assets = [
    { source = "target/release/noteliner", dest = "/usr/bin/noteliner", mode = "755" },
    { source = "../../../packaging/linux/com.nathanlaan.noteliner.desktop", dest = "/usr/share/applications/com.nathanlaan.noteliner.desktop", mode = "644" },
    { source = "../../../packaging/linux/com.nathanlaan.noteliner.metainfo.xml", dest = "/usr/share/metainfo/com.nathanlaan.noteliner.metainfo.xml", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/16x16/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/24x24/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/32x32/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/48x48/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/64x64/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/128x128/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/256x256/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.nathanlaan.noteliner.png", mode = "644" },
    { source = "../../../packaging/generated/noteliner/icons/512x512/com.nathanlaan.noteliner.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.nathanlaan.noteliner.png", mode = "644" },
]
# Sonames, not package names, so the requirements hold across RPM distros.
[package.metadata.generate-rpm.requires]
git = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"
[package.metadata.generate-rpm.conflicts]
note-liner = "*"
[package.metadata.generate-rpm.obsoletes]
note-liner = "*"
[package.metadata.generate-rpm.provides]
note-liner = "*"

# AppImage, the Windows NSIS installer and the macOS .app/.dmg (cargo-packager).
[package.metadata.packager]
product-name = "NoteLiner"
identifier = "com.nathanlaan.noteliner"
description = "Outliner-style Markdown notes with git sync"
homepage = "https://github.com/NathanLaan/marina"
authors = ["Nathan Laan"]
publisher = "Nathan Laan"
copyright = "Copyright (c) 2026 Nathan Laan"
license-file = "../../../LICENSE"
category = "Productivity"
out-dir = "../../../target/packages/noteliner"
binaries-dir = "../../../target/release"
binaries = [{ path = "noteliner", main = true }]
icons = ["../../../packaging/generated/noteliner/icons/*/com.nathanlaan.noteliner.png"]

# The AppImage's desktop entry (cargo-packager builds it from its deb config).
[package.metadata.packager.deb]
desktop-template = "../../../packaging/linux/com.nathanlaan.noteliner.appimage.desktop.hbs"

[package.metadata.packager.nsis]
installer-icon = "../../../packaging/generated/noteliner/com.nathanlaan.noteliner.ico"
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
