[package]
name = "spike-editor"
version = "0.1.0"
description = "Option C spike 1: is egui's TextEdit with a Markdown-highlighting layouter good enough for NoteLiner's editor?"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "spike-editor"

[[bin]]
name = "spike-editor"
path = "src/main.rs"

[[bin]]
name = "editor-bench"
path = "src/bin/editor-bench.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
log.workspace = true
spike-common.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
