[package]
name = "spike-epub"
version = "0.1.0"
description = "Spike 4: a native EPUB reader over the spike-richtext blocks."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
spike-common.workspace = true
spike-richtext = { path = "../richtext" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
epub = "2"
anyhow.workspace = true
percent-encoding = "2"
scraper = "0.27"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
