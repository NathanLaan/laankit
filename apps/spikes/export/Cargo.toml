[package]
name = "spike-export"
version = "0.1.0"
description = "Option C spike 5: NoteLiner Markdown → PDF in-process (comrak AST → Typst markup → typst-pdf), no system fonts or external tools."
edition.workspace = true
license.workspace = true
# typst 0.15 needs Rust 1.92 (the workspace default is 1.85).
rust-version.workspace = true
publish = false

[[bin]]
name = "spike-export"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
comrak = { version = "0.39", default-features = false }
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
noteliner-core = { path = "../../../crates/noteliner-core" }
