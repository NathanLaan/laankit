<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChartLiner icon: rounded tile with two boxes on a grid, joined by an
       elbow arrow. Placeholder art for the Phase 0 scaffold; replace with
       the final design later. -->
  <defs>
    <clipPath id="clFrameClip">
      <rect x="22" y="22" width="468" height="468" rx="76" ry="76"/>
    </clipPath>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="76" ry="76" fill="#1e1e2e" stroke="#11111b" stroke-width="8"/>

  <g clip-path="url(#clFrameClip)">
    <!-- The snapping grid -->
    <g stroke="#313244" stroke-width="4">
      <line x1="96" y1="22" x2="96" y2="490"/>
      <line x1="176" y1="22" x2="176" y2="490"/>
      <line x1="256" y1="22" x2="256" y2="490"/>
      <line x1="336" y1="22" x2="336" y2="490"/>
      <line x1="416" y1="22" x2="416" y2="490"/>
      <line x1="22" y1="96" x2="490" y2="96"/>
      <line x1="22" y1="176" x2="490" y2="176"/>
      <line x1="22" y1="256" x2="490" y2="256"/>
      <line x1="22" y1="336" x2="490" y2="336"/>
      <line x1="22" y1="416" x2="490" y2="416"/>
    </g>
    <!-- A rectangle (top left) and a rounded rectangle (bottom right) -->
    <rect x="96" y="96" width="160" height="96" fill="#1e1e2e" stroke="#89b4fa" stroke-width="18" stroke-linejoin="round"/>
    <rect x="256" y="320" width="160" height="96" rx="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="18"/>
    <!-- The connector: down from the first box, across, into the second -->
    <path d="M176 192 L176 368 L222 368" fill="none" stroke="#a6adc8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 368 L214 342 L214 394 Z" fill="#a6adc8" stroke="#a6adc8" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
