[package]
name = "medialiner-native"
version = "0.1.0"
description = "MediaLiner: browse and organize the photos in your folders, where they are. An egui UI over medialiner-core."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "medialiner"
path = "src/main.rs"

[dependencies]
medialiner-core.workspace = true
laankit-core.workspace = true
laankit-egui.workspace = true
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Open With Default App and folders in the file manager.
open = "5"
# 0.15, as in the other apps: see apps/noteliner/native/Cargo.toml.
rfd = "0.15"

# build.rs embeds the icon in the .exe (Windows hosts only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "3"

# --- Packaging (docs/packaging.md) --------------------------------------------
# Run `cargo run -p xtask -- icons` first: the icons come from packaging/generated.
# As PrintLiner's: no git, and no older package names.

[package.metadata.deb]
name = "medialiner"
maintainer = "Nathan Laan <NathanLaan@users.noreply.github.com>"
copyright = "2026, Nathan Laan"
license-file = ["../../../LICENSE", "0"]
extended-description = """\
Browse and organize the photos in your folders, where they are: a tree \
of your folders, a grid of thumbnails, a preview, file and EXIF details, \
and merging one folder into another, with undo."""
section = "graphics"
priority = "optional"
# $auto adds libc/libgcc. The rest are dlopened by winit/glutin/fontconfig, so
# dpkg-shlibdeps can't see them.
depends = "$auto, libegl1, libgl1, libfontconfig1, libxkbcommon0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1, libxkbcommon-x11-0"
assets = [
    ["target/release/medialiner", "usr/bin/", "755"],
    ["../../../packaging/linux/com.medialiner.app.desktop", "usr/share/applications/", "644"],
    ["../../../packaging/linux/com.medialiner.app.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../../packaging/generated/medialiner/icons/16x16/com.medialiner.app.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/24x24/com.medialiner.app.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/32x32/com.medialiner.app.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/48x48/com.medialiner.app.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/64x64/com.medialiner.app.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/128x128/com.medialiner.app.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/256x256/com.medialiner.app.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../../packaging/generated/medialiner/icons/512x512/com.medialiner.app.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "medialiner"
license = "MIT"
summary = "Browse and organize the photos in your folders"
url = "https://github.com/NathanLaan/laankit"
assets = [
    { source = "target/release/medialiner", dest = "/usr/bin/medialiner", mode = "755" },
    { source = "../../../packaging/linux/com.medialiner.app.desktop", dest = "/usr/share/applications/com.medialiner.app.desktop", mode = "644" },
    { source = "../../../packaging/linux/com.medialiner.app.metainfo.xml", dest = "/usr/share/metainfo/com.medialiner.app.metainfo.xml", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/16x16/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/24x24/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/32x32/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/48x48/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/64x64/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/128x128/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/256x256/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.medialiner.app.png", mode = "644" },
    { source = "../../../packaging/generated/medialiner/icons/512x512/com.medialiner.app.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.medialiner.app.png", mode = "644" },
]
# Sonames, not package names, so the requirements hold across RPM distros.
[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"

# AppImage, the Windows NSIS installer and the macOS .app/.dmg (cargo-packager).
[package.metadata.packager]
product-name = "MediaLiner"
identifier = "com.medialiner.app"
description = "Browse and organize the photos in your folders"
homepage = "https://github.com/NathanLaan/laankit"
authors = ["Nathan Laan"]
publisher = "Nathan Laan"
copyright = "Copyright (c) 2026 Nathan Laan"
license-file = "../../../LICENSE"
category = "Photography"
out-dir = "../../../target/packages/medialiner"
binaries-dir = "../../../target/release"
binaries = [{ path = "medialiner", main = true }]
icons = ["../../../packaging/generated/medialiner/icons/*/com.medialiner.app.png"]

# The AppImage's desktop entry (cargo-packager builds it from its deb config).
[package.metadata.packager.deb]
desktop-template = "../../../packaging/linux/com.medialiner.app.appimage.desktop.hbs"

[package.metadata.packager.nsis]
installer-icon = "../../../packaging/generated/medialiner/com.medialiner.app.ico"
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
