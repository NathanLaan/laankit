[package]
name = "medialiner-core"
version = "0.1.0"
description = "MediaLiner's backend: the folder list, folder scanning, media kinds, thumbnails and their cache, EXIF details, merging folders with a journal and undo, importing from drives and media devices, and showing a file in the file manager. UI-framework independent."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Photos: the workspace's formats plus BMP and TIFF.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# EXIF details and embedded thumbnails (pure Rust).
kamadak-exif = "0.6"
# Open in Folder's fallback: the folder in the file manager.
open = "5"

# Import: the free space on the destination.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Import: drive letters, and media devices (MTP) through Windows Portable Devices.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_PortableDevices",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
