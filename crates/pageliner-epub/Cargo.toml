[package]
name = "pageliner-epub"
version = "0.1.0"
description = "PageLiner's native EPUB reader: the book model, the reading view (contents, bookmarks, highlights) and its saved state. No webview."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
laankit-egui.workspace = true
laankit-richtext.workspace = true
egui.workspace = true
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
epub = "2"
percent-encoding = "2"
scraper = "0.27"

[dev-dependencies]
pageliner-core = { path = "../pageliner-core" }
eframe.workspace = true
egui_extras = { workspace = true, features = ["image"] }
egui_kittest.workspace = true
env_logger.workspace = true
image.workspace = true
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
