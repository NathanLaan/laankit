[package]
name = "laankit-richtext"
version = "0.1.0"
description = "Sanitized HTML/XHTML reduced to native rich-text blocks and laid out progressively with egui: ThreadLiner articles, PageLiner EPUB chapters, the NoteLiner preview."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
laankit-egui.workspace = true
egui.workspace = true
# Decodes images on a background thread (native); `http` fetches remote images, `svg` renders `.svg` sources.
egui_extras = { workspace = true, features = ["http", "svg", "gif", "webp"] }
base64.workspace = true
log.workspace = true
ammonia = "4"
scraper = "0.27"
url = "2"
percent-encoding = "2"
regex = "1"
# Inline `<svg>`: rasterized on a worker thread (`svg`). Same version egui_extras uses.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[dev-dependencies]
# The HTML the NoteLiner preview renders (comrak with its options), for conversion tests.
noteliner-core = { path = "../noteliner-core" }
# The `preview` example's window.
eframe.workspace = true
egui_kittest.workspace = true
serde_json.workspace = true
