[package]
name = "pageliner-core"
version = "0.1.0"
description = "PageLiner's backend: the EPUB/PDF library index, metadata and cover extraction, reading state. UI-framework independent."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
laankit-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
