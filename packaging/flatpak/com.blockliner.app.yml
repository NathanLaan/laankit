# BlockLiner as a Flatpak. Untested locally (no flatpak-builder on the dev
# machine); see docs/packaging.md for how to build it.
#
# Offline build: cargo-sources.json is generated from the workspace
# Cargo.lock by flatpak-cargo-generator (scripts/flatpak-sources.sh).
id: com.blockliner.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: blockliner
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The diagram folder is reopened by path at launch and watched for outside
  # changes; document-portal paths (/run/user/…/doc) would break both. No
  # network and no git: BlockLiner uses neither.
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: blockliner
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/blockliner/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline run -p xtask -- icons
      - cargo --offline build --release -p blockliner-native
      - install -Dm755 target/release/blockliner /app/bin/blockliner
      - install -Dm644 packaging/linux/com.blockliner.app.desktop /app/share/applications/com.blockliner.app.desktop
      - install -Dm644 packaging/linux/com.blockliner.app.metainfo.xml /app/share/metainfo/com.blockliner.app.metainfo.xml
      - install -Dm644 packaging/linux/com.blockliner.app.mime.xml /app/share/mime/packages/com.blockliner.app.xml
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 packaging/generated/blockliner/icons/${s}x${s}/com.blockliner.app.png /app/share/icons/hicolor/${s}x${s}/apps/com.blockliner.app.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - node_modules
          - packaging/generated
      - cargo-sources.json
