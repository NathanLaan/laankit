name: build
on: [push, pull_request]
jobs:
  # Pure Rust (egui): the shared native crates and the native apps, on every
  # target platform. See docs/plans/plan-native-rust-egui.md.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy -p marina-core -p marina-egui -p marina-richtext -p threadliner-native -p pageliner-native -p pageliner-epub -p noteliner-core -p noteliner-native -p marina-editor -p noteliner-export -p noteliner-slides -p chartliner-core -p chartliner-native --all-targets -- -D warnings
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          cargo test -p marina-core -p marina-egui -p marina-richtext -p threadliner-native -p pageliner-native -p pageliner-epub -p noteliner-core -p noteliner-native -p marina-editor -p noteliner-export -p noteliner-slides -p chartliner-core -p chartliner-native
